version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: coffeeshop_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: coffeeshop_pos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coffeeshop_pos"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: coffeeshop_web
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Coffee Shop POS
      - APP_ENV=production
      - DEBUG=false
      - PORT=8000
      - HOST=0.0.0.0
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - SHOP_NAME=${SHOP_NAME}
      - TAX_RATE=${TAX_RATE}
      - LOYALTY_POINT_REWARD_RATE=${LOYALTY_POINT_REWARD_RATE}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
