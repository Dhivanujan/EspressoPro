version: '3.8'

services:
  db:
    image: mongo:6.0
    container_name: coffeeshop_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand({ping:1})' | mongosh localhost:27017/test --quiet"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: coffeeshop_web
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Coffee Shop POS
      - APP_ENV=production
      - DEBUG=false
      - PORT=8000
      - HOST=0.0.0.0
      - MONGODB_URL=mongodb://db:27017
      - MONGODB_DB=coffeeshop_pos
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - SHOP_NAME=${SHOP_NAME}
      - TAX_RATE=${TAX_RATE}
      - LOYALTY_POINT_REWARD_RATE=${LOYALTY_POINT_REWARD_RATE}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mongo_data:
